server:
  port: 8080

spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: "http://localhost:8083"
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600
      routes:
        - id: orders
          uri: ${ORDERS_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/orders/**
          filters:
            - AddRequestHeader=user-id, user1

        - id: payments
          uri: ${PAYMENTS_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/payments/**
          filters:
            - AddRequestHeader=user-id, user1

        - id: ws
          uri: ws://orders-service:8081
          predicates:
            - Path=/ws/**